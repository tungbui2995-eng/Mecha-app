<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MechaProject — Quản lý dự án cơ khí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #0a0c10;
  --bg1: #111318;
  --bg2: #171b23;
  --bg3: #1e2330;
  --bg4: #262d3d;
  --bg5: #2f3850;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.11);
  --border3: rgba(255,255,255,0.18);
  --text0: #eef0f4;
  --text1: #9aa3b5;
  --text2: #5c6578;
  --accent: #4f8ef7;
  --accent-dim: rgba(79,142,247,0.12);
  --accent-glow: rgba(79,142,247,0.25);
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.1);
  --amber: #fbbf24;
  --amber-dim: rgba(251,191,36,0.1);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.1);
  --purple: #a78bfa;
  --teal: #2dd4bf;
  --teal-dim: rgba(45,212,191,0.1);
  --orange: #fb923c;
  --r: 8px;
  --r2: 12px;
  --r3: 16px;
  --sidebar-w: 248px;
  --topbar-h: 58px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg0);
  color: var(--text0);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border3); }

/* ── LOADING OVERLAY ── */
.global-loading {
  position: fixed; inset: 0; background: rgba(10,12,16,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; gap: 14px; transition: opacity 0.3s; backdrop-filter: blur(6px);
}
.spinner-ring {
  width: 40px; height: 40px; position: relative;
}
.spinner-ring::before, .spinner-ring::after {
  content: ''; position: absolute; border-radius: 50%;
}
.spinner-ring::before {
  inset: 0; border: 2px solid var(--bg4);
}
.spinner-ring::after {
  inset: 0; border: 2px solid transparent; border-top-color: var(--accent);
  animation: spin 0.7s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; color: var(--text1); letter-spacing: 0.03em; }
.loading-sub { font-size: 11px; color: var(--text2); }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.logo {
  padding: 18px 16px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 11px;
}
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, #3a7de0 0%, #6366f1 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(79,142,247,0.3);
}
.logo-mark svg { width: 18px; height: 18px; }
.logo-name { font-size: 14px; font-weight: 700; letter-spacing: -0.03em; color: var(--text0); }
.logo-tag { font-size: 10px; color: var(--text2); margin-top: 1px; letter-spacing: 0.06em; text-transform: uppercase; }

.nav-section { padding: 10px 0 2px; }
.nav-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em; color: var(--text2);
  text-transform: uppercase; padding: 0 16px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 16px; cursor: pointer;
  font-size: 13px; color: var(--text1); border-left: 2px solid transparent;
  transition: all .15s; user-select: none; position: relative;
}
.nav-item:hover { color: var(--text0); background: rgba(255,255,255,0.03); }
.nav-item.active {
  color: var(--accent); background: var(--accent-dim);
  border-left-color: var(--accent); font-weight: 500;
}
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .6; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-item.active-red {
  color: var(--red) !important; background: var(--red-dim);
  border-left-color: var(--red) !important; font-weight: 500;
}
.nav-item.active-red .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto; font-size: 10px; font-weight: 700;
  background: var(--accent-dim); color: var(--accent);
  padding: 1px 6px; border-radius: 20px; min-width: 20px; text-align: center;
}
.nav-badge.red { background: var(--red-dim); color: var(--red); }
.sidebar-footer { margin-top: auto; border-top: 1px solid var(--border); padding: 8px 0 10px; }
.sidebar-footer .nav-item { color: var(--accent); }
.sidebar-footer .nav-item:hover { background: var(--accent-dim); }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  background: var(--bg1); border-bottom: 1px solid var(--border);
  padding: 0 22px; height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.topbar-breadcrumb {
  display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden;
}
.topbar-crumb-root { font-size: 12px; color: var(--text2); white-space: nowrap; }
.topbar-crumb-sep { color: var(--text2); font-size: 12px; }
.topbar-title { font-size: 14px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.drive-status {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2);
  background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px;
}
.drive-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
  border-radius: var(--r); border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text0); cursor: pointer; font-size: 12px; font-weight: 500;
  font-family: inherit; transition: all .15s; white-space: nowrap; flex-shrink: 0;
  letter-spacing: 0.01em;
}
.btn:hover { background: var(--bg4); border-color: var(--border3); }
.btn:active { transform: scale(0.98); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(79,142,247,0.3); }
.btn-accent:hover { background: #3a7de0; border-color: #3a7de0; box-shadow: 0 4px 14px rgba(79,142,247,0.4); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-xs { padding: 3px 8px; font-size: 10px; border-radius: 6px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text1); }
.btn-ghost:hover { background: var(--bg3); color: var(--text0); border-color: var(--border); }
.btn-green { background: var(--green-dim); border-color: rgba(52,211,153,0.2); color: var(--green); }
.btn-green:hover { background: rgba(52,211,153,0.2); border-color: rgba(52,211,153,0.35); }
.btn-danger { background: var(--red-dim); border-color: rgba(248,113,113,0.2); color: var(--red); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.btn svg { flex-shrink: 0; }

/* ── CONTENT ── */
.content { flex: 1; overflow-y: auto; padding: 20px 22px; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── SECTION HEADER ── */
.section-hd {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.section-hd-left { flex: 1; }
.section-hd h2 { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.section-hd p { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ── STAT CARDS ── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2);
  padding: 16px 18px; position: relative; overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.stat:hover { border-color: var(--border2); transform: translateY(-1px); }
.stat-accent-line {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  border-radius: var(--r2) var(--r2) 0 0;
}
.stat-num {
  font-size: 26px; font-weight: 700; letter-spacing: -.04em;
  font-family: 'JetBrains Mono', monospace; line-height: 1; margin-bottom: 6px;
}
.stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.stat-sub { font-size: 11px; color: var(--text1); margin-top: 5px; }

/* ── PROGRESS ── */
.prog-wrap { height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(0.4,0,0.2,1); }

/* ── BADGES ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0.01em;
}
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-blue { background: var(--accent-dim); color: var(--accent); }
.badge-amber { background: var(--amber-dim); color: var(--amber); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-gray { background: var(--bg3); color: var(--text1); border: 1px solid var(--border); }
.badge-teal { background: var(--teal-dim); color: var(--teal); }
.badge-purple { background: rgba(167,139,250,0.12); color: var(--purple); }

/* ── CARD ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
.card-header {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.card-title { font-size: 13px; font-weight: 600; flex: 1; }
.card-body { padding: 16px; }

/* ── TABLES ── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700;
  letter-spacing: .1em; color: var(--text2); text-transform: uppercase;
  border-bottom: 1px solid var(--border); background: var(--bg1);
  white-space: nowrap;
}
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr:hover td { background: var(--bg3); }
.tbl-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text2); }

/* ── PHASE TIMELINE ── */
.phase-timeline { display: flex; gap: 0; margin-bottom: 24px; position: relative; }
.phase-timeline::after {
  content: ''; position: absolute; top: 17px; left: 4%; right: 4%;
  height: 2px; background: var(--border); z-index: 0;
}
.phase-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; cursor: pointer; }
.phase-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; border: 2px solid var(--border2);
  background: var(--bg2); transition: all .2s; font-family: 'JetBrains Mono', monospace;
}
.phase-dot.done { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.phase-dot.active-ph { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.phase-dot.pending { color: var(--text2); }
.phase-step-label { font-size: 10px; color: var(--text2); text-align: center; max-width: 68px; line-height: 1.4; }
.phase-step.active-ph .phase-step-label { color: var(--text0); font-weight: 500; }

/* ── MODALS ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r3);
  width: 520px; max-height: 88vh; overflow-y: auto;
  transform: translateY(14px) scale(0.98); transition: transform .22s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,0.04);
}
.overlay.open .modal { transform: translateY(0) scale(1); }
.modal-hd {
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 600;
}
.modal-close { color: var(--text2); cursor: pointer; padding: 4px; border-radius: 6px; transition: all .15s; }
.modal-close:hover { background: var(--bg4); color: var(--text0); }
.modal-body { padding: 20px; }
.modal-ft { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* ── FORMS ── */
.form-row { margin-bottom: 14px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.form-ctrl {
  width: 100%; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text0); font-size: 13px; font-family: inherit; transition: all .15s;
}
.form-ctrl:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,142,247,0.12); background: var(--bg4); }
.form-ctrl::placeholder { color: var(--text2); }
textarea.form-ctrl { resize: vertical; min-height: 72px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 20px; right: 20px; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: var(--r2);
  padding: 10px 14px 10px 12px; font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  transform: translateY(80px); opacity: 0; transition: all .25s cubic-bezier(0.34,1.56,0.64,1); z-index: 300;
}
.toast::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; flex-shrink: 0; }
.toast.show { transform: translateY(0); opacity: 1; }

/* ── DOCS / FOLDERS ── */
.docs-layout { display: grid; grid-template-columns: 228px 1fr; gap: 14px; }
.folder-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r2); padding: 10px; }
.folder-panel-title { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px 8px; }
.folder-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r);
  cursor: pointer; font-size: 12px; color: var(--text1); transition: all .12s; user-select: none;
}
.folder-item:hover { color: var(--text0); background: var(--bg3); }
.folder-item.active { color: var(--accent); background: var(--accent-dim); font-weight: 500; }
.folder-count { margin-left: auto; font-size: 10px; color: var(--text2); font-family: 'JetBrains Mono', monospace; background: var(--bg3); padding: 1px 6px; border-radius: 10px; }
.folder-item.active .folder-count { color: var(--accent); background: rgba(79,142,247,0.15); }

/* ── TWO COL ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--text2); font-size: 13px;
}
.empty-state-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
.empty-state-title { font-weight: 500; color: var(--text1); margin-bottom: 4px; }

/* ── ISSUE ROWS ── */
.issue-row { border-bottom: 1px solid var(--border); padding: 12px 16px; transition: background .1s; }
.issue-row:hover { background: var(--bg3); }
.issue-row:last-child { border-bottom: none; }

/* ── GANTT ── */
.gantt-row { margin-bottom: 14px; }
.gantt-row-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.gantt-row-name { font-size: 12px; font-weight: 500; }
.gantt-row-pct { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
.gantt-bar { height: 10px; border-radius: 5px; background: var(--bg4); overflow: hidden; }
.gantt-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--teal), var(--accent)); transition: width .6s ease; }

/* ── SEARCH BAR ── */
.search-wrap { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.search-input-wrap { position: relative; flex: 1; max-width: 280px; }
.search-input-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); pointer-events: none; }
.search-input { padding-left: 32px !important; }

/* ── DOWNLOAD BTN ── */
.download-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 6px; border: 1px solid rgba(79,142,247,0.25);
  background: var(--accent-dim); color: var(--accent);
  cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit;
  transition: all .15s; white-space: nowrap; text-decoration: none;
}
.download-btn:hover { background: rgba(79,142,247,0.2); border-color: rgba(79,142,247,0.4); }
.download-btn svg { flex-shrink: 0; }

/* ── FILE TYPE BADGE ── */
.file-type {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em;
}
.file-type-dwg { background: rgba(251,191,36,0.12); color: var(--amber); }
.file-type-pdf { background: rgba(248,113,113,0.12); color: var(--red); }
.file-type-xlsx { background: rgba(52,211,153,0.12); color: var(--green); }
.file-type-default { background: var(--bg3); color: var(--text1); }

/* ── PROGRESS LABEL ── */
.progress-label { display: flex;
